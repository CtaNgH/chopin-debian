# chopin: 电源键只做"熄屏/亮屏"，不做挂起。
#
# 挂起在这块板上不可用：每次尝试都会把显示拆掉（DSI underrun、面板半初始化），
# 反复尝试还会在屏幕边缘留下烙印。参考项目 chopin-support 的
# docs/SUSPEND-ANALYSIS.md 有完整分析，结论一致：不要挂起。
#
# 所以：
#   - logind 不处理电源键/睡眠键/合盖/空闲挂起（全部 ignore）；
#   - 电源键由 chopin-powerkey.service 直接读 PMIC 的 input 设备，切背光；
#   - GNOME 侧把 power-button-action 设成 'nothing'（dconf overlay 里）。
#
# 注意：不要用 mask sleep.target 的办法禁用挂起 —— 那会让 gnome-session
# 立刻退出，GDM 反复自动登录，屏幕一直闪。
[Login]
IdleAction=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
