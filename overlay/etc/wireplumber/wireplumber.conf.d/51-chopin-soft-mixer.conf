# chopin: the CS35L41 speaker card exposes one joined mono hardware volume
# control, and WirePlumber/PipeWire drives the sink volume through it.  The
# mixer value does not follow the slider (verified: the ALSA control stays
# put), so the system volume becomes cosmetic - 0% still plays at the fixed
# amplifier gain.  Force software volume for this card instead.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_output.platform-sound.stereo-fallback" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
