# chopin: interfaces NetworkManager must leave alone.
#
# usb0/usb1  the configfs gadget (CDC-NCM) is brought up by chopin-gadget.sh
#            with a static 192.168.42.2/24 + dnsmasq; NM must not reconfigure it.
# ap0        MediaTek soft-AP interface (hotspot), idle unless used.
# wlan1      second station interface of the same wiphy (dual-STA capable).
# p2p0       Wi-Fi Direct.
# The MTK driver exposes wlan0/wlan1/ap0/p2p0 on one wiphy; NM otherwise shows
# each as a separate Wi-Fi device (extra tabs in the control center) and tries
# to autoconnect station profiles on interfaces that can never associate.
# p2p-dev-* are the Wi-Fi Direct side of the same wiphy; NetworkManager
# creates a device for each of them and the GNOME panel lists them as extra
# Wi-Fi adapters.
[keyfile]
unmanaged-devices=interface-name:usb0;interface-name:usb1;interface-name:ap0;interface-name:wlan1;interface-name:p2p0;interface-name:p2p-dev-*
