[daemon]
# GNOME on Wayland: the MediaTek display controller (card1) + Mali-G77 (panfrost)
# are paired by Mesa's kmsro, and mutter's Wayland backend drives them through
# EGL/GBM directly.  The X11 path (modesetting + glamor + DRI2 GLX) can create
# contexts but mutter never presents a frame on it -- see BRINGUP.md 12.6.
WaylandEnable=true
AutomaticLoginEnable=true
AutomaticLogin=chopin
