[daemon]
# GNOME on Wayland: the MediaTek display controller (card1, mediatek-drm) and
# the Mali-G77 (card0/renderD128, panfrost) are paired by Mesa's kmsro, and
# mutter's Wayland backend drives them through EGL/GBM directly.
# The X11 path (modesetting + glamor + DRI2 GLX) can create GL contexts but
# mutter never presents a frame on it, so Wayland is the desktop here.
WaylandEnable=true
AutomaticLoginEnable=true
AutomaticLogin=chopin
